<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Petanque Master - Jeu de petanque pixel art provencal. 12 personnages, 5 terrains, physique realiste. Vise. Lance. Domine.">
    <meta property="og:title" content="Petanque Master">
    <meta property="og:description" content="Provencal pixel art petanque game. 12 characters, 5 terrains, realistic physics. Aim. Throw. Dominate.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/sprites/v2_new/ui/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Petanque Master">
    <meta name="twitter:description" content="Provencal pixel art petanque game. 12 characters, 5 terrains, realistic physics.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3A2E28">
    <link rel="icon" type="image/png" href="./assets/sprites/v2_new/ui/logo.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-180.png">
    <title>Petanque Master</title>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LBYNHVWWXG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-LBYNHVWWXG');
    </script>
    <style>
        @font-face {
            font-family: 'PressStart2P';
            src: url('/assets/fonts/PressStart2P.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        /* Expose safe-area-inset-* en CSS custom properties, consomme par Layout.js */
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #3A2E28;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Respecte le notch iOS et le home indicator */
            padding-top: var(--safe-area-top);
            padding-right: var(--safe-area-right);
            padding-bottom: var(--safe-area-bottom);
            padding-left: var(--safe-area-left);
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            width: 100%;
            height: 100%;
        }
        /* Anti-selection globale (requis CrazyGames/Poki) */
        * {
            -webkit-user-select: none;
            user-select: none;
        }
        /* Preload pixel font to avoid FOUT */
        .font-preload {
            font-family: 'PressStart2P', monospace;
            position: absolute;
            left: -9999px;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <span class="font-preload">.</span>

    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
